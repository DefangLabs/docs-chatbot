services:
  app:
    restart: always
    domainname: ask.defang.io
    x-defang-dns-role: arn:aws:iam::258338292852:role/dnsadmin-39a19c3
    platform: linux/amd64
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - target: 5050
        published: 5050
        protocol: tcp
        mode: ingress
    environment:
      ASK_TOKEN:
      DEBUG: 1
      FLASK_APP: app.py
      REBUILD_TOKEN:
      SECRET_KEY:
      SEGMENT_WRITE_KEY:
      SESSION_COOKIE_SECURE: 1
      # OPENAI_API_KEY and MODEL are injected by Defang from the "llm" model
      # below; OPENAI_BASE_URL is pinned here because the injected value ends in
      # a slash and the openai 0.x client would then request "/v1//chat/...".
      OPENAI_BASE_URL: "http://llm:4000/v1"
      INTERCOM_TOKEN:
      INTERCOM_ADMIN_ID:
      REDIS_URL: redis://redis:6379/0
    deploy:
      resources:
        reservations:
          memory: 4G
          cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/"]
      interval: 30s
      timeout: 10s
      # Azure Container Apps caps a probe's InitialDelaySeconds at 60 and Defang maps
      # start_period onto it, so 240s fails the deploy outright. Keep the startup
      # budget inside that limit (60 + 10*30 = 360s); ECS treats start_period as a
      # grace window, so this stays equivalent there.
      retries: 10
      start_period: 60s
    depends_on:
      - redis
    models:
      llm:
        endpoint_var: OPENAI_BASE_URL
        model_var: MODEL

  redis:
    image: redis:alpine
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: host

  discord-bot:
    restart: unless-stopped
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    ports:
      - mode: ingress
        target: 3000
        published: 3000
    environment:
      DISCORD_APP_ID:
      DISCORD_TOKEN:
      DISCORD_PUBLIC_KEY:
      ASK_TOKEN:
    deploy:
      resources:
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
    depends_on:
      - app

models:
  llm:
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
