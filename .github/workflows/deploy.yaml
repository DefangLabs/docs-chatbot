name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Set up cache for pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('app/requirements.txt') }}

      - name: Install Python dependencies
        working-directory: ./app
        run: pip install -r requirements.txt

      - name: Update knowledge_base.json
        working-directory: ./app
        run: python3 get_knowledge_base.py

      - name: Run tests for Intercom integration
        working-directory: ./app
        run: python3 test_intercom.py

      # No cloud-credential step: the Defang CLI exchanges this job's GitHub Actions OIDC
      # token for Azure credentials itself, using AZURE_CLIENT_ID / AZURE_TENANT_ID /
      # AZURE_SUBSCRIPTION_ID from .defang/production. Requires a federated credential for
      # subject repo:DefangLabs/docs-chatbot:environment:production on that client ID
      # (added in defang-mvp's pulumi/infrastructure, see DefangLabs/docs-chatbot#126).
      - name: Deploy
        uses: DefangLabs/defang-github-action@v2
        with:
          cli-version: nightly
          config-env-vars: ASK_TOKEN OPENAI_API_KEY REBUILD_TOKEN SECRET_KEY SEGMENT_WRITE_KEY DISCORD_APP_ID DISCORD_TOKEN DISCORD_PUBLIC_KEY INTERCOM_TOKEN INTERCOM_ADMIN_ID
          project: docs-chatbot
          stack: production
          provider: azure
          allow-upgrade: true

        env:
          ASK_TOKEN: ${{ secrets.ASK_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REBUILD_TOKEN: ${{ secrets.REBUILD_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          INTERCOM_TOKEN: ${{ secrets.INTERCOM_TOKEN }}
          INTERCOM_ADMIN_ID: ${{ secrets.INTERCOM_ADMIN_ID }}
